name: Keep-working checks

# Features the owner already asked for must keep working when anything
# else changes (CLAUDE.md "Don't change what already works"). Runs on every
# pull request; a red ❌ here means a change broke something that worked —
# fix it before merging.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  keep-working:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep-working checks (History totals, day cut-off, sign-in)
        run: node tests/keep-working.test.mjs
