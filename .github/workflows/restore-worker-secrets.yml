name: Restore worker secrets (one-time)

# Manual only. Actions tab -> "Restore worker secrets (one-time)" -> Run workflow.
# See .github/scripts/restore-worker-secrets.mjs for what it does.
on:
  workflow_dispatch:
    inputs:
      source_version:
        description: 'Worker version that still has all secrets'
        required: true
        default: '8c85f1f7'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Copy secrets onto a new worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: node .github/scripts/restore-worker-secrets.mjs
