# Cloudflare Worker: xfitting-lookup (the backend API)
# Deployed automatically by Cloudflare Workers Builds on every push to main
# (dashboard → Workers & Pages → xfitting-lookup → Settings → Build,
#  root directory = "/", deploy command = "npx wrangler deploy").
#
# This file must stay at the repo root. Without it, Cloudflare auto-detects
# the HTML files here and deploys them as a static site instead of the worker.

name = "xfitting-lookup"
main = "worker/src/index.js"
compatibility_date = "2024-01-01"

# Keep the plain-text variables that are set in the dashboard.
# Secrets (API keys, PINs, private keys) are never touched by deploys.
keep_vars = true

# D1 database, used everywhere in the code as env.DB.
# This block must stay here. Deploying without it removes the DB binding.
[[d1_databases]]
binding = "DB"
database_name = "xfitting-d1"
database_id = "50823e63-c8ea-4f0c-b576-8289506b61fc"

# Cron triggers: left out on purpose, so the schedules already set in the
# dashboard (Settings → Triggers) stay unchanged. Adding a [triggers] block
# here would replace the dashboard schedules completely.
